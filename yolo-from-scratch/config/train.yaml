# YOLOv1 training configuration (PASCAL VOC defaults)

model:
  num_classes: 20
  num_boxes: 2
  grid_size: 7
  backbone: "pretrained_resnet50"          # options: custom | pretrained_resnet18 | pretrained_resnet50
  pretrained_backbone: true                # IMPORTANT: use ImageNet weights (training from scratch on a small VOC subset does not converge)

data:
  train_root: "data/voc/train"
  val_root: "data/voc/val"
  image_size: 448
  num_workers: 4
  augment: true

  # PASCAL VOC download / preparation (run: python prepare_voc.py)
  voc:
    auto_prepare: true       # download & convert before training if data is missing
    output_dir: "data/voc"
    years: ["2007"]            # "2007" only (~900 MB) | add "2012" for full set (~3 GB)
    max_train_samples: 0    # cap train images (0 = no limit, full trainval ~5011 for 2007)
    max_val_samples: 0      # cap val images   (0 = no limit, full test ~4952 for 2007)
    classes: null              # null = all 20 VOC classes | e.g. ["person", "car", "dog"]
    force_download: false

train:
  epochs: 75
  batch_size: 16
  learning_rate: 0.001         # SGD base LR (fine-tuning a pretrained backbone); warmup + cosine schedule applied
  warmup_epochs: 3             # linearly ramp LR from ~0 to learning_rate over the first epochs
  min_learning_rate: 0.0001    # final LR reached by cosine annealing
  weight_decay: 0.0005
  momentum: 0.9
  grad_clip: 5.0
  lambda_coord: 5.0
  lambda_noobj: 0.5
  seed: 42
  device: "auto"
  save_dir: "checkpoints/yolov1"
  log_interval: 10
  save_interval: 10

inference:
  conf_threshold: 0.3
  nms_iou_threshold: 0.5
